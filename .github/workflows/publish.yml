# On a version tag: test, publish the package to PyPI, then list the release in the MCP Registry.
#
#   git tag -a v1.2.3 -m "opendeck-mcp 1.2.3" && git push origin v1.2.3
#
# The tag must match pyproject.toml's version. Both publishes use the workflow's OIDC identity, so
# no tokens are stored: PyPI needs this repo + workflow + the "pypi" environment registered once as a
# trusted publisher for the opendeck-mcp project, and the registry accepts io.github.kastro5/* from it.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # OIDC for PyPI trusted publishing and the MCP Registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check the tag matches the version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
          test "$(jq -r .version server.json)" = "$version" || { echo "server.json version != $version"; exit 1; }

      - name: Test
        run: |
          uv sync --locked
          uv run pytest -q -m "not live"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          # PyPI can take a moment to serve a new release, and the registry checks it exists.
          for i in 1 2 3 4 5 6; do
            ./mcp-publisher login github-oidc && ./mcp-publisher publish && exit 0
            sleep 20
          done
          exit 1
